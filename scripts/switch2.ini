[binaries]
c = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc'
cpp = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++'
ar = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar'
strip = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip'
# Meson 1.0.x requires the historical key name (no hyphen).
pkgconfig = '/opt/devkitpro/portlibs/switch2/bin/aarch64-none-elf-pkg-config'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a78c'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
default_library = 'static'
c_args = ['-mcpu=cortex-a78c+crypto', '-mtp=soft', '-fPIC', '-ftls-model=local-exec', '-D__SWITCH__', '-D__SWITCH2__', '-D_GNU_SOURCE', '-I/opt/devkitpro/libounce/include', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include']
cpp_args = ['-mcpu=cortex-a78c+crypto', '-mtp=soft', '-fPIC', '-ftls-model=local-exec', '-D__SWITCH__', '-D__SWITCH2__', '-D_GNU_SOURCE', '-I/opt/devkitpro/libounce/include', '-I/opt/devkitpro/portlibs/switch2/include', '-I/opt/devkitpro/portlibs/switch/include']
c_link_args = ['-specs=/opt/devkitpro/libounce/switch.specs', '-L/opt/devkitpro/libounce/lib', '-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib']
cpp_link_args = ['-specs=/opt/devkitpro/libounce/switch.specs', '-L/opt/devkitpro/libounce/lib', '-L/opt/devkitpro/portlibs/switch2/lib', '-L/opt/devkitpro/portlibs/switch/lib']
